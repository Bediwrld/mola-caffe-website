<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - Mola Caffe</title>
  <link rel="icon" href="https://mola.mk/wp-content/uploads/2024/04/logo-150x150.png">
  <link rel="stylesheet" href="../main/style.css">
  <link rel="stylesheet" href="contact.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <!-- Navbar (main site style) -->
  <nav class="navbar">
    <div class="nav-brand">
      <img src="https://mola.mk/wp-content/uploads/2024/04/logo-150x150.png" alt="Mola Caffe Logo">
      <span>Mola Caffe</span>
    </div>
    <div class="nav-toggle">
      <span></span><span></span><span></span>
    </div>
    <ul class="nav-menu">
      <li><a href="/index.html" class="nav-link">Home</a></li>
      <li><a href="/Project/people-of-mola/peopleofmola.html" class="nav-link">#peopleofmola</a></li>
      <li><a href="/Project/menu/menu.html" class="nav-link">Menu</a></li>
      <li><a href="/Project/contact/contact.html" class="nav-link active">Contact us</a></li>
    </ul>
  </nav>
  <div class="bubble-bg">
    <div class="bubble bubble1"></div>
    <div class="bubble bubble2"></div>
    <div class="bubble bubble3"></div>
    <div class="bubble bubble4"></div>
    <div class="bubble bubble5"></div>
  </div>
  <div class="logo-watermark-bg"></div>
  <main class="contact-main-wrapper">
    <section class="contact-section-new contact-row-layout">
      <div class="contact-card-new">
        <div class="card-focus-glow"></div>
        <h1 class="contact-title">Contact Us</h1>
        <form class="contact-form-new" id="contactForm">
          <div class="form-row">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required>
          </div>
          <div class="form-row">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
          </div>
          <div class="form-row">
            <label for="subject">Subject</label>
            <input type="text" id="subject" name="subject" required>
          </div>
          <div class="form-row">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" required></textarea>
          </div>
          <button type="submit">Send Message</button>
        </form>
        <div class="thank-you-message-new" style="display:none;">
          <h2>Thank you for contacting us!</h2>
          <p>We appreciate your message and will get back to you soon.</p>
        </div>
      </div>
      <div class="map-card-new">
        <h2 class="map-title">Our Location</h2>
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2965.0145746669555!2d21.433595875566684!3d41.99996275777635!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x1354152ed23e6fc7%3A0x64efe99257b942e3!2zTW9sYSBDYWZlIC8g0JzQvtC70LAg0JrQsNGE0LU!5e0!3m2!1sen!2smk!4v1753707764275!5m2!1sen!2smk" width="100%" height="280" style="border:0; border-radius: 16px;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
        <div class="map-info-new">
          <p><i class="fas fa-map-marker-alt"></i> Old Bazaar, Skopje, North Macedonia</p>
          <p><i class="fas fa-phone"></i> +389 XX XXX XXX</p>
          <p><i class="fas fa-envelope"></i> info@mola.mk</p>
        </div>
      </div>
    </section>
  </main>
  <footer class="footer-glass">
    <div class="footer-glass-content">
      <div class="footer-brand-glass">
        <img src="https://mola.mk/wp-content/uploads/2024/04/logo-150x150.png" alt="Mola Caffe Logo">
        <span>Mola Caffe</span>
      </div>
      <div class="footer-social-glass">
        <a href="#" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
        <a href="#" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
        <a href="#" aria-label="Twitter"><i class="fab fa-twitter"></i></a>
      </div>
      <div class="footer-info-glass">
        <span>&copy; 2025 Mola Caffe. All rights reserved.</span>
      </div>
    </div>
  </footer>
  <script>
    document.getElementById('contactForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const form = e.target;
      const data = {
        name: form.name.value,
        email: form.email.value,
        subject: form.subject.value,
        message: form.message.value
      };
      const res = await fetch('http://localhost:3001/api/contact', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      if (res.ok) {
        form.style.display = 'none';
        document.querySelector('.thank-you-message-new').style.display = 'block';
      } else {
        alert('There was an error sending your message. Please try again later.');
      }
    });
  </script>
  <script>
// Hamburger menu toggle for mobile (main site logic)
const navToggle = document.querySelector('.nav-toggle');
const navMenu = document.querySelector('.nav-menu');
const navLinks = document.querySelectorAll('.nav-link');
const body = document.body;

navToggle.addEventListener('click', () => {
  navToggle.classList.toggle('active');
  navMenu.classList.toggle('active');
  body.classList.toggle('menu-open');
});

navLinks.forEach(link => {
  link.addEventListener('click', () => {
    navToggle.classList.remove('active');
    navMenu.classList.remove('active');
    body.classList.remove('menu-open');
  });
});

document.addEventListener('click', (e) => {
  if (!navMenu.contains(e.target) && !navToggle.contains(e.target) && navMenu.classList.contains('active')) {
    navToggle.classList.remove('active');
    navMenu.classList.remove('active');
    body.classList.remove('menu-open');
  }
});
</script>
</body>
</html>
